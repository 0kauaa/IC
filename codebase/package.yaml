name:         ic
version:      0.1.0.0
github:       "0kauaa/IC"
license:      MIT
author:       "Kauã Santana"
maintainer:   "kauassilva0023@gmail.com"

# configurações compartilhadas globalmente
default-extensions:
  - DataKinds
  - TypeOperators
  - GADTs

ghc-options:
  - -Wall

# dependências compartilhadas globalmente
dependencies:
  - base >= 4.17 && < 5
  - cassava
  - bytestring
  - vector

# biblioteca
library:
  source-dirs: src

  # api global
  exposed-modules:
    # core estrutural
    - Core.Cat
    - Core.Learner
    - Core.Params
    - Core.Utils
    
    # modelos
    - Models.LinearRegressor
    - Models.PolynomialRegressor
    - Models.StandardRegressor
    - Models.LogisticRegressor
    - Models.Net

    # treinamento
    - Training.Training
    - Training.Accuracy

    # dados
    - Dataset.Synthetic.Linear
    - Dataset.Synthetic.Polynomial
    - Dataset.Synthetic.Classified
    - Dataset.Empirical.IrisPCA2

    # sandbox
    - Sandbox.Activations
    - Sandbox.Layers
    - Sandbox.Outputs
    - Sandbox.Preprocessing

# arquivos executaveis
executables:

  # regressor linear
  linear-regressor:
    main: Main.hs
    source-dirs:
      - app/linear-regressor
    dependencies:
      - ic

  # regressor padronizado
  standard-regressor:
    main: Main.hs
    source-dirs:
      - app/standard-regressor
    dependencies:
      - ic

  # regressor polinomial
  polynomial-regressor:
    main: Main.hs
    source-dirs:
      - app/polynomial-regressor
    dependencies:
      - ic

  # regressor logistico
  logistic-regressor:
    main: Main.hs
    source-dirs:
      - app/logistic-regressor
    dependencies:
      - ic

  # rede neural
  small-net:
    main: Main.hs
    source-dirs:
      - app/small-net
    dependencies:
      - ic

  # dataset iris 
  iris-pca2:
    main: Main.hs
    source-dirs:
      - app/iris-pca2
    dependencies:
      - ic
  
  # playground do sandbox
  playground:
    main: Main.hs
    source-dirs:
      - app/playground
    dependencies:
      - ic

# testes
tests:
  test:
    main: Testes.hs
    source-dirs:
      - test
    dependencies:
      - ic